name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install libudev-dev (required by go-udev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Build
        run: CGO_ENABLED=1 GOOS=linux go build -mod=mod -ldflags "-s -w" -o build/ix-exporter ./cmd/ix-exporter

      - uses: actions/upload-artifact@v4
        with:
          name: ix-exporter
          path: build/ix-exporter
