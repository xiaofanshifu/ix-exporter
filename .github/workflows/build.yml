name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install libudev-dev (required by go-udev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Build
        run: CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} go build -mod=mod -ldflags "-s -w" -o build/ix-exporter-linux-${{ matrix.goarch }} ./cmd/ix-exporter

      - uses: actions/upload-artifact@v4
        with:
          name: ix-exporter-linux-${{ matrix.goarch }}
          path: build/ix-exporter-linux-${{ matrix.goarch }}

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          files: |
            dist/ix-exporter-linux-amd64/ix-exporter-linux-amd64
            dist/ix-exporter-linux-arm64/ix-exporter-linux-arm64
